<dx-select-box *ngIf="lookup"
               [class]='incomingClasses'
               [label]="label"
               [name]="name"
               [(value)]="value"
               [readOnly]="readOnly"
               [visible]="visible"
               [dataSource]="lookup.dataSource$ | async"
               [displayExpr]="(lookup.displayExpr$ | async) ?? undefined"
               [valueExpr]="(lookup.valueExpr$ | async) ?? ''"
               [showClearButton]="true"
               [searchEnabled]="true"
               [acceptCustomValue]="(lookup.acceptCustomValue$ | async) ?? false"
               [grouped]="(lookup.grouped$ | async) ?? false"
               (onFocusIn)="focusIn.emit($event)"
               (onCustomItemCreating)="lookup.onCustomItemCreating($event)">
  <div *dxTemplate="let item of 'item'">
    {{lookup.getLookupItemDisplayValue(item)}}
    <br *ngIf="lookup.hasLookupItemHint$ | async"/>
    <small *ngIf="lookup.hasLookupItemHint$ | async">{{lookup.getLookupItemHintValue(item)}}</small>
  </div>
  <dx-validator [validationRules]="validationRules"></dx-validator>
</dx-select-box>
