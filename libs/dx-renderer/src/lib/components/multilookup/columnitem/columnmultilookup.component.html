<dx-tag-box *ngIf="prepared && preparedColumn && lookup"
    #tagbox
    [readOnly]="(editing.readonly$ | async) ?? false"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="value"
    [dataSource]="(lookup.dataSource$ | async) ?? null"
    [displayExpr]="(lookup.displayExpr$ | async) ?? ''"
    [valueExpr]="(lookup.valueExpr$ | async) ?? ''"
    [showClearButton]="true"
    [acceptCustomValue]="(lookup.acceptCustomValue$ | async) ?? false"
    (onCustomItemCreating)="lookup.onCustomItemCreating($event)">
</dx-tag-box>
