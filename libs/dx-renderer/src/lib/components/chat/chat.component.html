<dx-chat
  [user]='(me$ | async) ?? { id: "none", name: "None" }'
  [typingUsers]='(writingUsers$ | async) ?? []'
  [items]="(conversation$ | async) ?? []"
  (onMessageEntered)="messageEntered($event)"
  messageTemplate="messageTemplate">
  <div *dxTemplate="let data of 'messageTemplate'">
    <div [innerHTML]="convertToHtml(data.message.text)"></div>
  </div>
</dx-chat>
