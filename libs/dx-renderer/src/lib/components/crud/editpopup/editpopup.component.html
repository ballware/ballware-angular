<dx-popup
  [visible]="true"
  [fullScreen]="(fullscreen || editLayout.fullscreen) ?? false"
  width="auto"
  height="auto"
  minWidth="90vw"
  maxHeight="90vh"
  maxWidth="90vw"
  [showCloseButton]="true"
  [resizeEnabled]="true"
  [animation]="{ hide: undefined, show: undefined }"
  [title]="title ?? ''"
  (onHidden)="onHidden()">
  <dxi-popup-toolbar-item *ngIf="mode !== EditModes.VIEW" widget="dxButton" [options]="{ text: applyAndCloseText, onClick: onApplyAndClose }" toolbar="bottom" location="after"></dxi-popup-toolbar-item>
  <dxi-popup-toolbar-item *ngIf="mode !== EditModes.VIEW && supportContinueAfterSave" widget="dxButton" [options]="{ text: applyAndContinueText, onClick: onApplyAndContinue }" toolbar="bottom" location="after"></dxi-popup-toolbar-item>
  <dxi-popup-toolbar-item *ngIf="mode !== EditModes.VIEW" widget="dxButton" [options]="{ text: cancelText, onClick: onHidden }" toolbar="bottom" location="after"></dxi-popup-toolbar-item>
  <dxi-popup-toolbar-item *ngIf="mode === EditModes.VIEW" widget="dxButton" [options]="{ text: closeText, onClick: onHidden }" toolbar="bottom" location="after"></dxi-popup-toolbar-item>
  <div *dxTemplate="let data of 'content'">    
    <ng-content></ng-content>    
  </div>
</dx-popup>
