<dx-text-box *ngIf="preparedColumn && 'string' === preparedColumn.type"
    #textbox
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="stringValue()">
</dx-text-box>
<dx-check-box *ngIf="preparedColumn && 'bool' === preparedColumn.type"
    #checkbox
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="boolValue()">
</dx-check-box>
<dx-number-box #editor *ngIf="preparedColumn && 'number' === preparedColumn.type"
    #numberbox
    dataType="number"
    [format]='preparedColumn.precision ? { type: "fixedPoint", precision: preparedColumn.precision } : undefined'
    [showSpinButtons]='true'
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="numberValue()">
</dx-number-box>
<dx-date-box *ngIf="preparedColumn && 'date' === preparedColumn.type"
    #datebox
    type="date"
    [displayFormat]="'format.date' | i18next"
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="dateValue()">
</dx-date-box>
<dx-date-box *ngIf="preparedColumn && 'datetime' === preparedColumn.type"
    #datetimebox
    type="datetime"
    [displayFormat]="'format.datetime' | i18next"
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="dateValue()">
</dx-date-box>
<dx-select-box *ngIf="preparedColumn && ('lookup' === preparedColumn.type || 'pickvalue' === preparedColumn.type) && lookup"
    #selectbox
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="lookupValue()"
    [dataSource]="(lookup.dataSource$ | async) ?? null"
    [displayExpr]="(lookup.displayExpr$ | async) ?? ''"
    [valueExpr]="(lookup.valueExpr$ | async) ?? ''"
    [showClearButton]="true"
    [acceptCustomValue]="(lookup.acceptCustomValue$ | async) ?? false"
    (onCustomItemCreating)="lookup.onCustomItemCreating($event)">
</dx-select-box>
<dx-tag-box *ngIf="preparedColumn && 'staticmultilookup' === preparedColumn.type && lookup"
    #statictagbox
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="multiLookupValue()"
    [dataSource]="(lookup.dataSource$ | async) ?? null"
    [displayExpr]="(lookup.displayExpr$ | async) ?? ''"
    [valueExpr]="(lookup.valueExpr$ | async) ?? ''">
</dx-tag-box>
<dx-tag-box *ngIf="preparedColumn && 'multilookup' === preparedColumn.type && lookup"
    #tagbox
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="multiLookupValue()"
    [dataSource]="(lookup.dataSource$ | async) ?? null"
    [displayExpr]="(lookup.displayExpr$ | async) ?? ''"
    [valueExpr]="(lookup.valueExpr$ | async) ?? ''"
    [showClearButton]="true"
    [acceptCustomValue]="(lookup.acceptCustomValue$ | async) ?? false"
    (onCustomItemCreating)="lookup.onCustomItemCreating($event)">
</dx-tag-box>
<ballware-edit-detaileditpopup *ngIf="preparedColumn && 'editpopup' === preparedColumn.type"
    [column]="preparedColumn"
    [readOnly]="((readonly.readonly$ | async) ?? false) || !(preparedColumn.editable ?? false)"
    [item]="detailItem">
</ballware-edit-detaileditpopup>
