<dx-check-box *ngIf="preparedColumn && 'bool' === preparedColumn.type"
    #checkbox
    [readOnly]="readonly"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="boolValue()">
</dx-check-box>
<dx-number-box #editor *ngIf="preparedColumn && 'number' === preparedColumn.type"
    #numberbox
    [readOnly]="readonly"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="numberValue()">
</dx-number-box>
<dx-date-box *ngIf="preparedColumn && 'date' === preparedColumn.type"
    #datebox
    type="date"
    [displayFormat]="'format.date' | i18next"
    [readOnly]="readonly"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="dateValue()">
</dx-date-box>
<dx-date-box *ngIf="preparedColumn && 'datetime' === preparedColumn.type"
    #datetimebox
    type="datetime"
    [displayFormat]="'format.datetime' | i18next"
    [readOnly]="readonly"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="dateValue()">
</dx-date-box>
<dx-tag-box *ngIf="preparedColumn && 'staticmultilookup' === preparedColumn.type && lookup"
    #statictagbox
    [readOnly]="readonly"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="multiLookupValue()"
    [dataSource]="(lookup.dataSource$ | async) ?? null"
    [displayExpr]="(lookup.displayExpr$ | async) ?? ''"
    [valueExpr]="(lookup.valueExpr$ | async) ?? ''">
</dx-tag-box>
<dx-tag-box *ngIf="preparedColumn && 'multilookup' === preparedColumn.type && lookup"
    #tagbox
    [readOnly]="readonly"
    (onValueChanged)="onValueChanged ? onValueChanged($event) : undefined"
    [value]="multiLookupValue()"
    [dataSource]="(lookup.dataSource$ | async) ?? null"
    [displayExpr]="(lookup.displayExpr$ | async) ?? ''"
    [valueExpr]="(lookup.valueExpr$ | async) ?? ''"
></dx-tag-box>
<ballware-edit-detaileditpopup *ngIf="preparedColumn && 'popup' === preparedColumn.type"
    [column]="preparedColumn"
    [readOnly]="false"
    [item]="item">
</ballware-edit-detaileditpopup>
