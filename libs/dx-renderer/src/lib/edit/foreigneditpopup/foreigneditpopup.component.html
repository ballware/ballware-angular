<ballware-crud-dialog
  *ngIf="itemOperation && itemOperation.editLayout && !itemOperation.externalEditor && !itemOperation.foreignEntity"
  [fullscreen]="fullscreen"
  [mode]="itemOperation.mode"
  [entity]="itemOperation.entity"
  [title]="itemOperation.title"
  [item]="itemOperation.item"
  [editLayout]="itemOperation.editLayout"
  [apply]="applyEdit"
  [cancel]="cancelEdit">
    <ballware-edit-layout></ballware-edit-layout>
</ballware-crud-dialog>
