<ballware-crud-dialog
  *ngIf="itemDialog && itemDialog.editLayout && !itemDialog.externalEditor && !itemDialog.foreignEntity"
  [fullscreen]="fullscreen"
  [mode]="itemDialog.mode"
  [entity]="itemDialog.entity"
  [title]="itemDialog.title"
  [item]="itemDialog.item"
  [editLayout]="itemDialog.editLayout"
  [apply]="applyEdit"
  [cancel]="cancelEdit">
    <ballware-edit-layout></ballware-edit-layout>
</ballware-crud-dialog>
