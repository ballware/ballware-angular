<ballware-crud-dialog
  *ngIf="editOperation && editOperation.editLayout && !editOperation.externalEditor && !editOperation.foreignEntity"
  [fullscreen]="(fullscreenDialogs$ | async) ?? false"
  [mode]="editOperation.mode"
  [title]="editOperation.title"
  [entity]="editOperation.entity"
  [item]="editOperation.item"
  [editLayout]="editOperation.editLayout"
  [supportContinueAfterSave]="editOperation.supportContinueAfterSave"
  [apply]="applyEdit"
  [cancel]="cancelEdit">
  <ballware-edit-layout></ballware-edit-layout>
</ballware-crud-dialog>
<ballware-crud-foreigneditpopup *ngIf="editOperation && !editOperation.externalEditor && editOperation.foreignEntity && editOperation.customFunction"
  [fullscreen]="(fullscreenDialogs$ | async) ?? false"
  [customFunctionEntity]="editOperation.foreignEntity"
  [customFunctionId]="editOperation.customFunction.id"
  [customFunctionParam]="editOperation.item"
  (editFinished)="cancelEdit()">
</ballware-crud-foreigneditpopup>
<dx-popup *ngIf="editOperation && editOperation.externalEditor"
  [visible]="true"
  [showCloseButton]="true"
  [title]="editOperation.title"
  [fullScreen]="true"
  [animation]="{ hide: undefined, show: undefined }"
  (onHidden)="onExternalEditorDialogClose()">
  <iframe [title]="editOperation.title" class="w-100 h-100" [src]="sanitizedExternalEditorUrl"></iframe>
</dx-popup>
<dx-popup *ngIf="removeOperation"
  [visible]="true"
  [showCloseButton]="true"
  [fullScreen]="(fullscreenDialogs$ | async) ?? false"
  [title]="'datacontainer.titles.remove' | i18next: { entity: displayName$ | async }"
  [animation]="{ hide: undefined, show: undefined }"
  (onHidden)="onRemoveDialogCancel()"
  width="auto"
  minWidth="500px"
  height="auto">
  <dxi-popup-toolbar-item widget="dxButton" [options]="{ type: 'danger', text: 'editing.actions.remove' | i18next, onClick: onRemoveDialogApply }" toolbar="bottom" location="after"></dxi-popup-toolbar-item>
  <dxi-popup-toolbar-item widget="dxButton" [options]="{ type: 'default', text: 'editing.actions.cancel' | i18next, onClick: onRemoveDialogCancel }" toolbar="bottom" location="after"></dxi-popup-toolbar-item>
  <div *dxTemplate="let data of 'content'">
    <p>{{'datacontainer.messages.remove' | i18next: { entity: displayName$ | async } }}</p>
  </div>
</dx-popup>
<dx-popup *ngIf="importOperation"
  [visible]="true"
  [showCloseButton]="true"
  [fullScreen]="(fullscreenDialogs$ | async) ?? false"
  [title]="'datacontainer.titles.import' | i18next: { entity: displayName$ | async }"
  [animation]="{ hide: undefined, show: undefined }"
  (onHidden)="onImportDialogCancel()"
  width="auto"
  minWidth="500px"
  height="auto">
  <div *dxTemplate="let data of 'content'">
    <dx-file-uploader width="400px" [multiple]="false" accept="*" uploadMode="instantly" [uploadFile]="onImportDialogApply"> </dx-file-uploader>
  </div>
</dx-popup>
<ballware-crud-dialog
  *ngIf="detailColumnEditOperation"
  [fullscreen]="(fullscreenDialogs$ | async) ?? false"
  [mode]="detailColumnEditOperation.mode"
  [title]="detailColumnEditOperation.title"
  [entity]="detailColumnEditOperation.entity"
  [item]="detailColumnEditOperation.editableItem"
  [editLayout]="detailColumnEditOperation.editLayout"
  [apply]="applyDetailColumnEdit"
  [cancel]="cancelDetailColumnEdit">
  <ballware-edit-layout></ballware-edit-layout>
</ballware-crud-dialog>
<dx-action-sheet #actionMenu
  width="auto"
  [showCancelButton]="true"
  [usePopover]="!((fullscreenDialogs$ | async) ?? false)"
  [title]="'datacontainer.actionsheet.title' | i18next"
  (onItemClick)="actionItemClicked($event)">
</dx-action-sheet>
<dx-action-sheet #printMenu
  width="auto"
  [showCancelButton]="true"
  [usePopover]="!((fullscreenDialogs$ | async) ?? false)"
  [title]="'datacontainer.actions.print' | i18next"
  (onItemClick)="printMenuItemClicked($event)">
</dx-action-sheet>
<dx-action-sheet #addMenu
  width="auto"
  [showCancelButton]="true"
  [usePopover]="!((fullscreenDialogs$ | async) ?? false)"
  [title]="'datacontainer.actions.add' | i18next: { entity: displayName$ | async }"
  (onItemClick)="addMenuItemClicked($event)">
</dx-action-sheet>
<dx-action-sheet #exportMenu
  width="auto"
  [showCancelButton]="true"
  [usePopover]="!((fullscreenDialogs$ | async) ?? false)"
  [title]="'datacontainer.actions.export' | i18next: { entity: displayName$ }"
  (onItemClick)="exportMenuItemClicked($event)">
</dx-action-sheet>
<dx-action-sheet #importMenu
  width="auto"
  [showCancelButton]="true"
  [usePopover]="!((fullscreenDialogs$ | async) ?? false)"
  [title]="'datacontainer.actions.import' | i18next: { entity: displayName$ }"
  (onItemClick)="importMenuItemClicked($event)">
</dx-action-sheet>
