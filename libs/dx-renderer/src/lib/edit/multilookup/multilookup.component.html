<dx-tag-box *ngIf="livecycle.layoutItem && livecycle.layoutItem.options && livecycle.layoutItem.options.dataMember && (lookup.ready$ | async)"
  class="mt-2"
  [visible]="(visible.visible$ | async) ?? false"
  [label]="livecycle.layoutItem.options.caption ?? ''"
  [name]="livecycle.layoutItem.options.dataMember"
  [(value)]="value.value"
  [readOnly]="(readonly.readonly$ | async) ?? false"
  [dataSource]="(lookup.dataSource$ | async) ?? null"
  [displayExpr]="(lookup.displayExpr$ | async) ?? ''"
  [valueExpr]="(lookup.valueExpr$ | async) ?? ''"
  [searchEnabled]=true
  [showClearButton]=true
  [showSelectionControls]=true
  [showDropDownButton]=true
  [multiline]=false
  [grouped]="(lookup.grouped$ | async) ?? false"
  [acceptCustomValue]="(lookup.acceptCustomValue$ | async) ?? false"
  (onFocusIn)="livecycle.onEntered()">
  <div *dxTemplate="let item of 'item'">
    {{lookup.getLookupItemDisplayValue(item)}}
    <br *ngIf="lookup.hasLookupItemHint$ | async"/>
    <small *ngIf="lookup.hasLookupItemHint$ | async">{{lookup.getLookupItemHintValue(item)}}</small>
  </div>
  <dx-validator [validationRules]="(validation.validationRules$ | async) ?? []"></dx-validator>
</dx-tag-box>
