name: Testing and code analysis

on:
  push:
    branches: ['main', 'develop', 'feature/*', 'bugfix/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: 'Install Dependencies'
        run: yarn install --frozen-lockfile
      - name: Test and coverage
        run: yarn test
      - name: Build Storybook
        run: yarn nx run dx-renderer:build-storybook --configuration=ci
      - name: Start Storybook
        run: npx http-server dist/storybook/dx-renderer -p 4200 -c-1 &
      - name: Wait for Storybook
        run: npx wait-on http://localhost:4200
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: yarn nx test-storybook dx-renderer -- --junit --coverage --coverageDirectory=coverage/storybook
      - name: Test Report (JUnit)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Storybook Tests
          path: junit.xml
          reporter: jest-junit
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
